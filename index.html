<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ゲーム置き場</title>
<meta name="robots" content="noindex, nofollow, noimageindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* 一覧ページ。ゲームの情報は各フォルダの game-info.js から読み込む */
:root{
  --bg:#eef1f6; --card:#ffffff; --ink:#1c2433; --muted:#5d6880; --line:#d6dce8;
  --accent:#2d5bd8; --accent-ink:#ffffff; --chip:#e6ecf8; --chip-ink:#2d4a8f;
  --f-head:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141922; --card:#1d2431; --ink:#e7ebf3; --muted:#9aa6bd; --line:#2d3646;
  --accent:#6f95ff; --accent-ink:#0f1522; --chip:#25304a; --chip-ink:#b9cbff; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
header{margin-bottom:24px}
h1{font-family:var(--f-head);font-weight:800;font-size:clamp(26px,5vw,36px);margin:0;letter-spacing:.02em}
.lead{color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.thumb{display:block;aspect-ratio:16/9;background:linear-gradient(135deg,#3a5bd0,#7d58c9 55%,#e0577a);position:relative;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s ease}
.thumb:hover img{transform:scale(1.03)}
.thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--f-head);font-weight:800;font-size:22px;padding:12px;text-align:center}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
h2{font-family:var(--f-head);font-weight:800;font-size:20px;margin:0;line-height:1.4}
.desc{margin:0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tags li{font-size:12px;background:var(--chip);color:var(--chip-ink);padding:1px 10px;border-radius:99px;font-weight:700}
.desc p{margin:0 0 .8em}
.desc p:last-child{margin-bottom:0}
.info{margin:0;border-top:1px dashed var(--line);padding-top:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:13px}
.info dt{color:var(--muted);font-weight:700;white-space:nowrap}
.info dd{margin:0}
.play:focus-visible,.thumb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.play{margin-top:auto;align-self:flex-start;display:inline-block;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:800;font-family:var(--f-head);padding:9px 22px;border-radius:10px}
.play:hover{filter:brightness(1.08)}
.note{margin-top:28px;color:var(--muted);font-size:13px}
.msg{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.thumb img{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ゲーム置き場</h1>
    <p class="lead">AIと一緒に作ったゲームです。気になるものから遊んでみてください。</p>
  </header>
  <main class="grid" id="list"><p class="msg">読み込み中…</p></main>
  <p class="note">セーブデータや記録は、遊んだブラウザの中にだけ保存されます。別のブラウザや端末には引き継がれません。</p>
</div>

<!-- 並べるゲームのフォルダ名の一覧 -->
<script src="games-list.js"></script>
<script>
// 各フォルダの game-info.js を順番に読み込む（ファイルを直接開いても、公開ページでも動くように script で読む）
function loadInfo(dir){
  return new Promise(resolve=>{
    window.GAME_INFO=null;
    const s=document.createElement('script');
    s.src=encodeURI(dir)+'/game-info.js';
    s.onload=()=>{const info=window.GAME_INFO;window.GAME_INFO=null;resolve(info?{...info,dir}:null);s.remove();};
    s.onerror=()=>{console.warn('game-info.js が読めません: '+dir);resolve(null);s.remove();};
    document.head.appendChild(s);
  });
}
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cardHTML(g){
  const href=encodeURI(g.dir)+'/index.html'; // ファイルを直接開いたときも動くように index.html まで書く
  const thumb=g.thumbnail
    ?`<img src="${encodeURI(g.dir)}/${esc(g.thumbnail)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph',textContent:${esc(JSON.stringify(g.title))}}))">`
    :`<span class="ph">${esc(g.title)}</span>`;
  const tags=(g.tags||[]).length?`<ul class="tags">${g.tags.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'';
  // 説明文：空行で段落、改行はそのまま改行
  const desc=g.description?`<div class="desc">${String(g.description).split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('')}</div>`:'';
  const info=(g.info||[]).length?`<dl class="info">${g.info.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`:'';
  return `<article class="card">
    <a class="thumb" href="${href}" tabindex="-1" aria-hidden="true">${thumb}</a>
    <div class="body">
      <h2>${esc(g.title||g.dir)}</h2>
      ${tags}${desc}${info}
      <a class="play" href="${href}">遊ぶ</a>
    </div>
  </article>`;
}
(async()=>{
  const list=document.getElementById('list');
  const dirs=(typeof GAME_DIRS!=='undefined'&&Array.isArray(GAME_DIRS))?GAME_DIRS:[];
  const games=[];
  for(const d of dirs){const g=await loadInfo(d); if(g) games.push(g);}
  list.innerHTML=games.length?games.map(cardHTML).join(''):'<p class="msg">ゲームが見つかりませんでした。games-list.js と各フォルダの game-info.js を確認してください。</p>';
})();
</script>
</body>
</html>
